# Publishes a GitHub release when the version in manifest.json changes on main:
# creates the v<version> tag, builds the store zip and attaches it, with the
# version's CHANGELOG.md section as the release notes. Does nothing if that
# version is already tagged.
name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: npm test

      - name: Build zip
        if: steps.version.outputs.exists == 'false'
        run: npm run zip

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
          cat notes.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/hill-radar-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Hill Radar $VERSION" \
            --notes-file notes.md
