<!DOCTYPE html>
<html tabindex="0" data-settings-key="hill-radar-settings-v1">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"/>

        <title>Hill Radar</title>

        <script src="/pages/src/preloads.js"></script>

        <link id="favicon" rel="shortcut icon" href="/pages/images/favicon.png"/>
        <link rel="stylesheet" href="/pages/css/common.css"/>
        <link rel="stylesheet" href="./css/hill-radar.css"/>

        <script type="module">
            import {main} from './src/hill-radar.mjs';
            main();
        </script>
    </head>
    <body>
        <div id="titlebar">
            <header>
                <div class="logo"><img src="/pages/images/icon128.png"/></div>
                <div class="title">Hill Radar</div>
                <div class="filler"></div>
                <div class="buttons">
                    <div class="button" id="route-climbs-button" title="Route climbs: list every climb on the route and preview it"><ms>list</ms></div>
                    <a class="button open-settings" href="hill-radar-settings.html?width=560&height=760&child-window"
                       title="Open settings window" target="hill-radar-settings"><ms>settings</ms></a>
                    <div title="Minimize" class="button minimize electron-only"><ms>minimize</ms></div>
                    <div title="Close this window" class="button close electron-only"><ms>close</ms></div>
                </div>
            </header>
        </div>
        <div id="content">
            <div class="climb" hidden>
                <div class="climb-header">
                    <span class="cat-badge" hidden></span>
                    <span class="climb-name"></span>
                    <span class="climb-meta"></span>
                    <span class="preview-close" title="Back to live" hidden>✕</span>
                </div>
                <div class="stats">
                    <div class="stat" data-stat="0"><div class="label"></div><div class="value"><span class="num"></span><span class="unit"></span></div></div>
                    <div class="stat" data-stat="1"><div class="label"></div><div class="value"><span class="num"></span><span class="unit"></span></div></div>
                    <div class="stat" data-stat="2"><div class="label"></div><div class="value"><span class="num"></span><span class="unit"></span></div></div>
                    <div class="stat" data-stat="3"><div class="label"></div><div class="value"><span class="num"></span><span class="unit"></span></div></div>
                </div>
                <div class="profile"><svg></svg></div>
            </div>
            <div class="route-list" hidden>
                <div class="route-list-header">
                    <span class="route-list-title"></span>
                    <span class="route-list-close" title="Close">✕</span>
                </div>
                <div class="rows"></div>
            </div>
            <div class="idle"></div>
            <div class="upcoming"></div>
            <div class="debug" hidden></div>
        </div>
    </body>
</html>
